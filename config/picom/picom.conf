#################################
# Backend
#################################

backend = "glx";
vsync = true;

#################################
# Shadows
#################################

shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;

#################################
# Corners
#################################

corner-radius = 0;

#################################
# Fading
#################################

fading = false;
# fade-in-step = 0.04;
# fade-out-step = 0.04;
# fade-delta = 5;
# no-fading-openclose = true;

#################################
# Opacity
#################################

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;

# dwm top bar at 75% opacity. Remove this block and it's fully reversible
# (bar background is drawn by dwm, so alpha blends with the desktop).
opacity-rule = [
    "75:class_g = 'dwm'"
];

#################################
# Background blur
#################################

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-fixed = true;

# dwm bar gets the same background blur as terminals.
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

#################################
# Animations
#################################

#animations = ({
#    triggers = [ "open", "show" ];
#    preset = "fly-in";
#    direction = "down";
#    duration = 0.25;
#}, {
#    triggers = [ "close", "hide" ];
#    preset = "fly-out";
#    direction = "down";
#    duration = 0.25;
#});

#################################
# Performance
#################################

use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

#################################
# Exclusions
#################################

shadow-exclude = [
    "class_g = 'Dmenu'",
    "class_g = 'Rofi'",
    "class_g = 'Notification'"
];

